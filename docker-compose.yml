services:
  db:
    image: postgres:17
    ports:
      - "5434:5432"
    environment:
      POSTGRES_DB: restaurantdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db-init:/docker-entrypoint-initdb.d:ro
      - ./foodordering-app-backend/FoodOrderingApp-db/src/main/resources/sql:/sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d restaurantdb"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./foodordering-app-backend
    ports:
      - "8080:8080"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: restaurantdb
      DB_USER: postgres
      DB_PASSWORD: ${POSTGRES_PASSWORD:-password}
      SERVER_PORT: 8080
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-600020608335-5q1g884j05n17dlo95u4jlej8ktmm6mb.apps.googleusercontent.com}
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./food-ordering-app-frontend
      args:
        REACT_APP_API_URL: ""
        REACT_APP_GOOGLE_CLIENT_ID: ${REACT_APP_GOOGLE_CLIENT_ID:-600020608335-5q1g884j05n17dlo95u4jlej8ktmm6mb.apps.googleusercontent.com}
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  pgdata:
